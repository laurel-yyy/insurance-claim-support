name: representative_consent_approved
description: 'David Chen: authorization matches, consent is requested, approved, and the call continues.'
today: '2026-03-10'
consent_scenario: default
turns:
- user: Hi, this is David Chen. I'm calling for my mom, Margaret Chen. Her birthday is March 15, 1985 and her phone is 650-521-2836.
    It's about her denied claim from January.
  expect:
    events_exclude: &id001
    - VERIFIED
    phase: VERIFY_ID
    events_include:
    - IDENTITY_VERIFIED
    verify_stage: consent
- user: Yes, please text her.
  expect:
    events_exclude: *id001
    phase: VERIFY_ID
    events_include:
    - CONSENT_REQUESTED
- user: Check again
  expect:
    events_include:
    - CONSENT_APPROVED
    - VERIFIED
    phase_in:
    - RESOLVE_INTENT
    - PROCESS_CASE
