name: document_alternatives_exhausted
description: No substitutes available either, so a claims specialist review is offered and accepted.
today: '2026-03-10'
consent_scenario: default
turns:
- user: I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from
    January. DOB is 1985-03-15, SSN last four is 4472.
  expect:
    phase_in:
    - PROCESS_CASE
    events_include:
    - HINT_STORED
    - VERIFIED
    - CLAIM_RESOLVED
    reply_contains_any:
    - CL-2048
    reply_contains_any_2:
    - pathology
    - office note
    reply_not_contains:
    - '4472'
    - '1985-03-15'
- user: I can't get the pathology report. The lab that did the test has closed.
  expect:
    phase: PROCESS_CASE
    reply_contains_any:
    - replacement
    - copy
    - resend
    - re-sent
- user: I already tried all of that. There's no copy or substitute of any kind anywhere.
  expect:
    events_include:
    - LIVE_AGENT_OFFERED
    phase: PROCESS_CASE
- user: Yes, please.
  expect:
    events_include:
    - ESCALATED
    escalated: true
