name: off_topic_retries
description: '''What is RL?'' and two more unrelated questions lead to a live-agent offer.'
today: '2026-03-10'
consent_scenario: default
turns:
- user: What is RL?
  expect:
    events_exclude: &id001
    - VERIFIED
    phase: VERIFY_ID
    events_include:
    - OFF_TOPIC_DECLINED
- user: Can you explain how transformers work in machine learning?
  expect:
    events_exclude: *id001
    phase: VERIFY_ID
    events_include:
    - OFF_TOPIC_DECLINED
- user: What's the weather going to be like tomorrow?
  expect:
    events_exclude: *id001
    phase: VERIFY_ID
    events_include:
    - OFF_TOPIC_DECLINED
    - LIVE_AGENT_OFFERED
