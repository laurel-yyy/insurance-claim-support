name: live_agent_request_midflow
description: A mid-conversation request for a human creates a handoff ticket.
today: '2026-03-10'
consent_scenario: default
turns:
- user: I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from
    January. DOB is 1985-03-15, SSN last four is 4472.
  expect:
    phase_in:
    - PROCESS_CASE
    events_include:
    - HINT_STORED
    - VERIFIED
    - CLAIM_RESOLVED
    reply_contains_any:
    - CL-2048
    reply_contains_any_2:
    - pathology
    - office note
    reply_not_contains:
    - '4472'
    - '1985-03-15'
- user: Actually, can I just talk to a real person?
  expect:
    events_include:
    - ESCALATED
    phase: ESCALATED
    escalated: true
